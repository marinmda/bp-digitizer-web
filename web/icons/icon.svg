<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- Rebuilt from the Android adaptive icon: ic_launcher_foreground.xml over
       @color/ic_launcher_background. The artwork sits between 32 and 76 on a
       108 canvas, so it clears the maskable safe zone (18-90) untouched. -->
  <rect width="108" height="108" fill="#FAF3E3"/>

  <!-- Camera scan brackets at the four corners of an inner frame. -->
  <g fill="none" stroke="#5C5C5C" stroke-width="3.5"
     stroke-linecap="round" stroke-linejoin="round">
