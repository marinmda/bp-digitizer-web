    <path d="M 64 32 L 76 32 L 76 44"/>
    <path d="M 32 64 L 32 76 L 44 76"/>
    <path d="M 64 76 L 76 76 L 76 64"/>
  </g>

  <!-- Material heart, scaled 1.667x (24 -> 40) and centred at (54,54). -->
