<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>wBP Digitizer</title>
<meta name="description" content="Log, chart and export blood pressure readings. Local-first: your readings stay on your device.">
<!-- The status bar takes this colour, so it tracks the page background rather
     than the accent: a red band above a near-white app reads as an alert. Two
     entries because the background differs by scheme; Chrome picks the light
     or dark status-bar icons to suit whichever it resolves. -->
<meta name="theme-color" content="#faf8f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141212" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest?v=__BUILD_VERSION__">
<link rel="icon" href="/icons/icon.svg?v=__BUILD_VERSION__" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=__BUILD_VERSION__">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- iOS has no media-scoped theme-color; default gives it dark-on-light. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="wBP Digitizer">
<link rel="stylesheet" href="/app.css?v=__BUILD_VERSION__">
</head>
<body>

<div class="wrap">

  <!-- dashboard ----------------------------------------------------------->
  <section class="view" id="view-dashboard">
    <header class="appbar">
      <h1 id="hero-title">wBP Digitizer</h1>
      <div class="appbar-actions" id="appbar-actions"></div>
    </header>

    <div class="chips" id="range-chips"></div>
    <div class="seg" id="mode-chips"></div>
    <div class="chart-wrap">
      <svg id="chart" role="img"></svg>
      <div class="readout" id="readout" hidden></div>
    </div>
    <div class="legend" id="legend"></div>

    <hr class="divider">

    <div class="card tonal" id="insights-card" hidden></div>
    <div class="card tonal" id="risk-card" hidden></div>

    <p class="empty" id="history-empty" hidden></p>
    <div class="list" id="history"></div>
  </section>

  <!-- add reading --------------------------------------------------------->
  <section class="view" id="view-add" hidden>
    <header class="hero">
      <button class="icon-btn" id="btn-add-back" aria-label="Back">←</button>
      <h1 id="add-title"></h1>
    </header>

    <div class="card">
      <div class="reading-preview">
        <span class="big" id="preview-sys">120</span><span class="slash">/</span><span class="big" id="preview-dia">80</span>
        <span class="unit">mmHg</span>
        <span class="cat-badge" id="preview-cat"></span>
      </div>

      <div class="slider-row">
        <span class="slider-label"><span id="lbl-sys"></span>
          <input class="val-input" id="val-sys" type="number" inputmode="numeric"
                 min="60" max="250" step="1" value="120"></span>
        <div class="stepper">
          <button type="button" class="step" data-step="-1" data-for="in-sys"
                  aria-label="-1">&minus;</button>
          <input type="range" id="in-sys" min="60" max="250" step="1" value="120">
          <button type="button" class="step" data-step="1" data-for="in-sys"
                  aria-label="+1">+</button>
        </div>
      </div>
      <div class="slider-row">
        <span class="slider-label"><span id="lbl-dia"></span>
          <input class="val-input" id="val-dia" type="number" inputmode="numeric"
                 min="40" max="160" step="1" value="80"></span>
        <div class="stepper">
          <button type="button" class="step" data-step="-1" data-for="in-dia"
                  aria-label="-1">&minus;</button>
          <input type="range" id="in-dia" min="40" max="160" step="1" value="80">
          <button type="button" class="step" data-step="1" data-for="in-dia"
                  aria-label="+1">+</button>
        </div>
      </div>
      <div class="slider-row">
        <span class="slider-label"><span id="lbl-pulse"></span>
          <input class="val-input" id="val-pulse" type="number" inputmode="numeric"
                 min="30" max="200" step="1" value="70"></span>
        <div class="stepper">
          <button type="button" class="step" data-step="-1" data-for="in-pulse"
                  aria-label="-1">&minus;</button>
          <input type="range" id="in-pulse" min="30" max="200" step="1" value="70">
          <button type="button" class="step" data-step="1" data-for="in-pulse"
                  aria-label="+1">+</button>
        </div>
      </div>

      <div class="hemo" id="hemo"></div>

      <div class="field">
        <label id="lbl-when"></label>
        <input type="datetime-local" id="in-when">
      </div>

      <div class="tags" id="tag-picker"></div>

      <div class="field">
        <label id="lbl-notes"></label>
        <textarea id="in-notes" rows="2"></textarea>
      </div>

      <input type="file" id="scan-file" accept="image/*" capture="environment" hidden>
    </div>

    <div class="action-bar">
      <button class="link" id="btn-cancel"></button>
      <button class="btn" id="btn-save"></button>
    </div>
  </section>

  <!-- profile ------------------------------------------------------------->
  <section class="view" id="view-profile" hidden>
    <header class="hero">
      <button class="icon-btn" id="btn-profile-back" aria-label="Back">←</button>
      <h1 id="profile-title"></h1>
    </header>
    <div class="card" id="profile-form"></div>
  </section>

  <!-- settings ------------------------------------------------------------>
  <section class="view" id="view-settings" hidden>
    <header class="hero">
      <button class="icon-btn" id="btn-settings-back" aria-label="Back">←</button>
      <h1 id="settings-title"></h1>
    </header>
    <div class="card" id="settings-body"></div>
      <p id="s-version" style="text-align:center;margin:16px 0 8px;font-size:.8rem;color:var(--muted);cursor:pointer">…</p>
  </section>

  <p class="foot" id="foot"></p>
</div>

<div class="fabs">
  <button class="fab small" id="fab-add"></button>
  <button class="fab" id="fab-scan" hidden></button>
</div>

<input type="file" id="s-file-global" accept="application/json,text/csv,.json,.csv" hidden>
<!-- Scan progress: the photo stays on screen under a scrim while the OCR
     request is in flight. -->
<div class="scanning" id="scanning" hidden>
  <img id="scan-shot" alt="">
  <div class="scan-card">
    <div class="scan-bar"><i></i></div>
    <p id="scan-status"></p>
    <button class="link" id="scan-cancel"></button>
  </div>
</div>

<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="/app.js?v=__BUILD_VERSION__"></script>
</body>
</html>
